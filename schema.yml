components:
  schemas:
    AdminTechnician:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        service_type:
          type: string
          maxLength: 100
        national_id:
          type: string
          format: uri
        profile_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        completed_orders:
          type: integer
          readOnly: true
        response_time:
          type: number
          format: double
          readOnly: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        is_approved:
          type: boolean
        is_verified:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_orders
      - created_at
      - email
      - id
      - is_active
      - is_verified
      - national_id
      - phone
      - profile_image
      - rating
      - response_time
      - service_type
      - updated_at
      - username
    AdminTechnicianRequest:
      type: object
      properties:
        service_type:
          type: string
          minLength: 1
          maxLength: 100
        national_id:
          type: string
          format: binary
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        is_approved:
          type: boolean
      required:
      - national_id
      - service_type
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/RoleEnum'
        profile_image:
          type: string
          format: uri
          nullable: true
        is_verified:
          type: boolean
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_joined
      - id
      - phone
      - updated_at
      - username
    AdminUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          minLength: 1
          maxLength: 20
        role:
          $ref: '#/components/schemas/RoleEnum'
        profile_image:
          type: string
          format: binary
          nullable: true
        is_verified:
          type: boolean
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
      required:
      - phone
      - username
    Commission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        service_request:
          type: integer
          readOnly: true
        technician:
          type: string
          readOnly: true
          nullable: true
        order_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        commission_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CommissionStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - commission_amount
      - commission_rate
      - created_at
      - id
      - order_amount
      - paid_at
      - service_request
      - status
      - technician
    CommissionStatusEnum:
      enum:
      - pending
      - paid
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        offer:
          type: integer
          readOnly: true
          nullable: true
        offer_id:
          type: integer
          readOnly: true
        service_request_id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        customer_username:
          type: string
          readOnly: true
        technician:
          type: integer
          readOnly: true
        technician_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_username
      - id
      - offer
      - offer_id
      - service_request_id
      - technician
      - technician_username
      - updated_at
    Login:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
        sender:
          type: integer
          readOnly: true
        sender_username:
          type: string
          readOnly: true
        message:
          type: string
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - conversation
      - created_at
      - id
      - is_read
      - message
      - sender
      - sender_username
    MessageRequest:
      type: object
      properties:
        conversation:
          type: integer
        message:
          type: string
          minLength: 1
      required:
      - conversation
      - message
    NearbyTechnician:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        service_type:
          type: string
          maxLength: 100
        rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        completed_orders:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        response_time:
          type: number
          format: double
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
